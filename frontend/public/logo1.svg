<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3B6F" />
      <stop offset="100%" stop-color="#0D6EFD" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B3B6F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Industrial Icon Emblem -->
  <g transform="translate(6, 6)" filter="url(#subtleGlow)">
    <!-- Shield / Hexagon Frame -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#primaryGrad)" />
    
    <!-- Precision Stylus / Dyne Pen Icon -->
    <path d="M26 12 L36 22 L22 36 L14 36 L14 28 Z" fill="#FFFFFF" />
    <path d="M22 36 L14 36 L14 28 Z" fill="url(#goldGrad)" />
    <circle cx="31" cy="17" r="2.2" fill="#0B3B6F" />
    
    <!-- Calibrated Dyne Measurement Waves / Tick Marks -->
    <line x1="33" y1="39" x2="38" y2="39" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" />
    <line x1="29" y1="43" x2="38" y2="43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(64, 25)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0B3B6F" letter-spacing="-0.3">
      IMAGETECH
    </text>
  </g>
  <g transform="translate(65, 41)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E65100" letter-spacing="3.5">
      INDUSTRIES
    </text>
  </g>
  <g transform="translate(65, 52)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" fill="#64748B" letter-spacing="0.8">
      ISO 9001:2015 • TESTING SOLUTIONS
    </text>
  </g>
</svg>
